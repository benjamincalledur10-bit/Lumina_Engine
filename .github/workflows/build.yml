name: Build

on:
  push:
    branches: [main, luminaenginedev]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.11
            java: 21
            project: fabric-1.21.11
          - minecraft: 26.2
            java: 25
            project: fabric-26.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build target and run common tests
        run: ./gradlew --no-daemon :common:test :${{ matrix.project }}:build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: lumina-engine-${{ matrix.minecraft }}
          path: ${{ matrix.project }}/build/libs/*.jar
          if-no-files-found: error
