plugins {
    id 'base'
}

group = 'dev.lumina'
version = '0.1.0-SNAPSHOT'

allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.isxander.dev/releases' }
    }
}

tasks.register('validateAll') {
    group = 'verification'
    description = 'Builds both Fabric targets and runs all shared unit tests.'
    dependsOn ':common:test', ':fabric-1.21.11:build', ':fabric-26.2:build'
}
